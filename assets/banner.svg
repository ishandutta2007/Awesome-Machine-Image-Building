<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    /* Dynamic pulsing & flowing keyframes */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(280px); opacity: 0; }
    }
    @keyframes badgeBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .pulse-glow-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 80px; }
    .pulse-glow-2 { animation: pulseGlow 8s ease-in-out infinite reverse; transform-origin: 1000px 280px; }
    .p-float-1 { animation: floatParticle 5s ease-in-out infinite; }
    .p-float-2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .p-float-3 { animation: floatParticle 6s ease-in-out infinite 3s; }
    .stream-line { stroke-dasharray: 8 12; animation: dashStream 3s linear infinite; }
    .scanner { animation: scanline 4s ease-in-out infinite; }
    .floating-card-1 { animation: badgeBob 4s ease-in-out infinite; }
    .floating-card-2 { animation: badgeBob 4.8s ease-in-out infinite 1s; }
    .floating-card-3 { animation: badgeBob 5.4s ease-in-out infinite 2s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient Dynamic Glow Orbs (Strictly in Background) -->
  <circle cx="220" cy="90" r="130" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulse-glow-1" />
  <circle cx="980" cy="270" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)" class="pulse-glow-2" />
  <circle cx="600" cy="180" r="100" fill="#6366f1" opacity="0.08" filter="url(#glow)" />

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
  </g>

  <!-- Animated Dynamic Data Stream Flow Lines -->
  <path d="M 60 300 Q 300 240 600 270 T 1140 120" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" class="stream-line" />
  <path d="M 80 70 Q 400 120 700 80 T 1120 280" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.35" class="stream-line" style="animation-direction: reverse; animation-duration: 4.5s;" />

  <!-- Floating Ambient Particles -->
  <circle cx="150" cy="140" r="3" fill="#38bdf8" class="p-float-1" />
  <circle cx="280" cy="290" r="4" fill="#818cf8" class="p-float-2" />
  <circle cx="880" cy="70" r="3.5" fill="#c084fc" class="p-float-3" />
  <circle cx="1060" cy="210" r="2.5" fill="#38bdf8" class="p-float-1" />

  <!-- Dynamic Animated Architecture Pills / Cards (Positioned in decorative lower corners) -->
  <g class="floating-card-1" opacity="0.9">
    <rect x="70" y="275" width="220" height="48" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="95" cy="299" r="6" fill="#10b981" />
    <text x="112" y="304" fill="#f1f5f9" font-size="13" font-weight="600" class="mono">⚡ Golden VM Pipelines</text>
  </g>

  <g class="floating-card-2" opacity="0.9">
    <rect x="490" y="275" width="220" height="48" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="515" cy="299" r="6" fill="#38bdf8" />
    <text x="532" y="304" fill="#f1f5f9" font-size="13" font-weight="600" class="mono">☁️ Multi-Cloud AMIs</text>
  </g>

  <g class="floating-card-3" opacity="0.9">
    <rect x="910" y="275" width="220" height="48" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="935" cy="299" r="6" fill="#ec4899" />
    <text x="952" y="304" fill="#f1f5f9" font-size="13" font-weight="600" class="mono">📦 Daemonless Containers</text>
  </g>

  <!-- FOREGROUND: Core Branding & Titles (Guaranteed Unobscured & Perfectly Centered) -->
  <g id="foreground-content">
    <!-- Top Category Tag -->
    <rect x="475" y="42" width="250" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="600" y="61" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5" class="mono">✨ CURATED CLOUD INFRASTRUCTURE</text>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" fill="url(#primaryGrad)" font-size="44" font-weight="900" letter-spacing="-0.5" class="sans" filter="url(#softGlow)">
      Awesome Machine Image Building
    </text>

    <!-- Subtitle -->
    <text x="600" y="176" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="500" class="sans">
      The Ultimate Golden Image, AMI, Container &amp; Cloud Provisioning Ecosystem
    </text>

    <!-- Description & Highlights -->
    <text x="600" y="214" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="400" class="mono">
      Packer • Buildah • Kaniko • Cloud-Init • BuildKit • OSBuild • Runner-Images • bootc
    </text>
  </g>
</svg>
